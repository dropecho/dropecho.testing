name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  ci:
    uses: dropecho/.github/.github/workflows/haxe-ci.yml@main
    with:
      # Oldest supported (the macros need Haxe 4.2+), the pinned default, and the latest release.
      haxe-versions: '["4.2.5", "4.3.0", "4.3.7"]'
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      # Posts coverage of the runtime code and the CLI on each pull request.
      coverage-script: test:coverage
    secrets: inherit
